# Perfil pensado para una DEMOSTRACIÓN rápida en Render.
# H2 es temporal dentro del contenedor; al redesplegar se pierden los datos.
# Si se desea MySQL administrado en la nube, NO usar este perfil y configurar
# DB_URL, DB_USERNAME y DB_PASSWORD en el proveedor.
spring.datasource.url=jdbc:h2:mem:banco2026;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
