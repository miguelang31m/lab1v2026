spring.application.name=lab1v2026
server.port=${PORT:8080}

# Configuración local por defecto. En nube se puede usar DB_URL/DB_USERNAME/DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco2026?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:banco_user}
spring.datasource.password=${DB_PASSWORD:banco123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# URL(es) separadas por coma. Para desarrollo se permite Vite local.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.version=${APP_VERSION:2.0.0}
